<script>
  // Live In-Stock Loader from Square
  async function loadBoothMenu() {
    const container = document.getElementById('provisions-list');
    const countBadge = document.getElementById('market-status-count');

    try {
      const res = await fetch('/api/products');
      const groupedItems = await res.json();

      // Flatten out variations so we only display in-stock items
      const inStockItems = [];
      groupedItems.forEach(parent => {
        (parent.variations || []).forEach(v => {
          if (v.isAvailable && v.stock > 0) {
            // Clean up name display: e.g. "Mustard - Mustard Caviar" or just "Mustard Caviar"
            const name = (v.name && v.name !== 'Standard')
              ? `${parent.name} (${v.name})`
              : parent.name;

            inStockItems.push({
              name: name,
              price: v.price,
              stock: v.stock,
              desc: parent.description || ''
            });
          }
        });
      });

      countBadge.textContent = `${inStockItems.length} Available Today`;

      if (inStockItems.length === 0) {
        container.innerHTML = `
          <div class="bg-charcoal-900 border border-stone-800 rounded-xl p-4 text-center text-xs text-stone-400">
            We are currently sold out for the day! Check back for our next batch.
          </div>
        `;
        return;
      }

      container.innerHTML = inStockItems.map(item => `
        <div class="bg-charcoal-900 border border-stone-800 rounded-xl p-4 transition">
          <div class="flex justify-between items-start gap-2">
            <div>
              <h4 class="font-bold text-stone-100 text-sm">
                ${item.name}
              </h4>
              ${item.desc ? `<p class="text-xs text-stone-400 mt-1">${item.desc}</p>` : ''}
            </div>
            <div class="text-right flex-shrink-0">
              <span class="text-sm font-bold font-mono text-rust-400 block">$${item.price.toFixed(2)}</span>
              <span class="text-[10px] font-mono text-emerald-400 bg-emerald-950/80 border border-emerald-800/60 px-1.5 py-0.5 rounded mt-1 inline-block">In Stock (${item.stock})</span>
            </div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      console.error("Failed to load booth items:", err);
      container.innerHTML = `<div class="text-xs text-stone-500 text-center py-4">Unable to load live menu right now.</div>`;
    }
  }
  loadBoothMenu();

  // Google Sheets subscriber webhook
  const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxEQ676WnnSPxDgXOOwcf2-_WJvDO1TwRwKQTkjPhyd2XQvlxPDcpRHWti1Gx4bFVBsbA/exec";

  async function handleFormSubmit(e) {
    e.preventDefault();
    const form = document.getElementById('market-signup-form');
    const confirmation = document.getElementById('signup-confirmation');
    const emailInput = document.getElementById('market-email');
    const signupBtn = document.getElementById('signup-btn');
    const email = emailInput.value.trim();

    if (!email) return;

    signupBtn.disabled = true;
    signupBtn.textContent = "Joining...";
    form.classList.add('hidden');
    confirmation.classList.remove('hidden');

    if (GOOGLE_SHEET_WEBHOOK_URL && !GOOGLE_SHEET_WEBHOOK_URL.includes("PASTE_YOUR_GOOGLE_SCRIPT")) {
      try {
        await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
      } catch (err) {
        console.error("Error logging subscriber:", err);
      }
    }
  }
</script>
